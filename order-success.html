{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="text-center py-5">

        <div
            class="rounded-circle bg-dark text-white d-inline-flex
                   align-items-center justify-content-center mb-4"
            style="width:80px;height:80px;font-size:35px;"
        >
            ✓
        </div>

        <h1 class="fw-bold">
            Order Placed Successfully
        </h1>

        <p class="text-muted">
            Thank you for shopping with us.
        </p>

        <div class="card border-0 shadow-sm mx-auto mt-4"
             style="max-width:600px;">

            <div class="card-body p-4">

                <p class="text-muted mb-1">
                    Order Number
                </p>

                <h4 class="fw-bold">
                    {{ order.order_number }}
                </h4>

                <hr>

                <p class="text-muted mb-1">
                    Total Amount
                </p>

                <h3 class="fw-bold">
                    ₹{{ "%.2f"|format(order.total_amount|float) }}
                </h3>

                <p class="mt-3 mb-0">
                    Payment:
                    <strong>{{ order.payment_status }}</strong>
                </p>

            </div>

        </div>


        <div class="mt-4">

            <a
                href="{{ url_for('products.track_order', order_id=order.id) }}"
                class="btn btn-dark px-4 me-2"
            >
                Track Order
            </a>

            <a
                href="{{ url_for('products.profile') }}"
                class="btn btn-outline-dark px-4"
            >
                My Orders
            </a>

        </div>

    </div>

</div>

{% endblock %}
